<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Seleção exclusiva · Caya Goods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#121212;--mute:#77746e;--line:#e5e2dc;--chip:#eeebe5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
header{text-align:center;padding:36px 16px 10px}
.logo{font-family:"Cormorant Garamond",serif;font-size:34px;letter-spacing:.32em;font-weight:500;margin:0}
.tag{color:var(--mute);font-size:11px;letter-spacing:.28em;text-transform:uppercase;margin-top:4px}
.intro{text-align:center;margin:22px auto 6px;max-width:640px;padding:0 16px}
.intro h1{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:28px;margin:0}
.intro p{color:var(--mute);margin:4px 0 0;font-size:13px}
.wrap{max-width:1180px;margin:auto;padding:0 16px 60px}
.bar{display:flex;justify-content:flex-end;margin:18px 0 10px;gap:8px;align-items:center;color:var(--mute);font-size:12px}
.bar select{font:12px Inter,sans-serif;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
h2{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);font-weight:500;margin:34px 0 12px;border-bottom:1px solid var(--line);padding-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--ink)}
.ph{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover}
.ph span{color:var(--mute);font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.b3d{position:absolute;right:10px;bottom:10px;background:rgba(18,18,18,.85);color:#fff;font-size:10px;letter-spacing:.14em;padding:5px 9px;border-radius:999px}
.info{padding:12px 14px 14px}
.t{font-weight:600}
.s{color:var(--mute);font-size:12px;margin-top:2px}
.p{margin-top:10px;font-size:18px;font-weight:600}
.code{font-size:10px;color:var(--mute);letter-spacing:.08em;margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(10,10,10,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:14px;max-width:920px;width:100%;max-height:94vh;overflow:auto;display:grid;grid-template-columns:1.25fr 1fr}
@media(max-width:760px){.mbox{grid-template-columns:1fr}}
.mbox iframe{width:100%;aspect-ratio:1;border:0;display:block;background:#fff}
.det{padding:22px}
.det h3{margin:0;font-size:20px}
.det table{width:100%;border-collapse:collapse;margin-top:14px}
.det th,.det td{text-align:left;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.det th{color:var(--mute);font-weight:400;width:45%}
.det .p{font-size:26px}
.x{float:right;border:0;background:none;font-size:24px;cursor:pointer;line-height:1;color:var(--mute)}
.note{margin-top:14px;padding:10px 12px;background:var(--chip);border-radius:8px;font-size:12px}
footer{text-align:center;color:var(--mute);font-size:11px;padding:20px}
</style>
</head>
<body>
<header><p class="logo">CAYA GOODS</p><div class="tag">Diamantes certificados</div></header>
<div class="intro"><h1 id="tit"></h1><p id="sub"></p></div>
<div class="wrap">
  <div class="bar">Ordenar <select id="ord"><option value="p">Menor preço</option><option value="-p">Maior preço</option><option value="-ct">Maior quilate</option></select></div>
  <div id="main"></div>
</div>
<div class="modal" id="m"><div class="mbox"><iframe id="v" allowfullscreen></iframe><div class="det" id="det"></div></div></div>
<footer>Orçamento exclusivo · valores sujeitos a confirmação de disponibilidade</footer>
<script>
const D={"titulo": "Seleção exclusiva", "cliente": "", "data": "11/11/2026", "ctmin": 0, "extra": null, "itens": [{"c": "CG-1XX1BHR", "n": "Redondo", "ct": 2.5, "cor": "M", "pur": "SI1", "lab": "HRD", "cps": "EX / EX / EX", "fl": "Forte", "med": "8.65 × 8.59 × 5.38 mm", "brl": 49140, "foto": true, "extra": false}, {"c": "CG-1MH2QU0", "n": "Redondo", "ct": 2.5, "cor": "M", "pur": "SI2", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Nenhuma", "med": "8.63 × 8.56 × 5.44 mm", "brl": 69384, "foto": true, "extra": false}, {"c": "CG-187NRVH", "n": "Redondo", "ct": 2.5, "cor": "M", "pur": "VVS2", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Forte", "med": "8.71 × 8.66 × 5.38 mm", "brl": 86184, "foto": true, "extra": false}, {"c": "CG-7QPLQJ", "n": "Redondo", "ct": 2.3, "cor": "L", "pur": "VVS1", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Nenhuma", "med": "8.4 × 8.33 × 5.22 mm", "brl": 104250, "foto": true, "extra": false}, {"c": "CG-17Q6U4X", "n": "Redondo", "ct": 2.5, "cor": "K", "pur": "VVS2", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Nenhuma", "med": "8.62 × 8.56 × 5.45 mm", "brl": 127288, "foto": true, "extra": false}, {"c": "CG-1A9DHUL", "n": "Redondo", "ct": 2.5, "cor": "I", "pur": "VVS1", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Média", "med": "8.8 × 8.77 × 5.24 mm", "brl": 155120, "foto": true, "extra": false}, {"c": "CG-SB9NI9", "n": "Redondo", "ct": 2.5, "cor": "G", "pur": "VVS2", "lab": "GIA", "cps": "EX / EX / EX", "fl": "Nenhuma", "med": "8.64 × 8.58 × 5.4 mm", "brl": 228396, "foto": true, "extra": false}]};
const brl=v=>'R$ '+v.toLocaleString('pt-BR');
const ct=v=>v.toFixed(2).replace('.',',');
document.getElementById('tit').textContent=D.titulo+(D.cliente?' — '+D.cliente:'');
document.getElementById('sub').textContent=D.itens.length+' diamantes selecionados · '+D.data;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function card(i,k){return `<div class="card" data-k="${k}">
 <div class="ph">${i.foto?`<img loading="lazy" src="img/${i.c}.jpg" alt="">`:`<span>${esc(i.n)}</span>`}<span class="b3d">3D</span></div>
 <div class="info"><div class="t">${esc(i.n)} ${ct(i.ct)} ct</div>
 <div class="s">Cor ${esc(i.cor)} · ${esc(i.pur)} · ${esc(i.lab)}</div>
 <div class="s">${esc(i.cps)} · Fluor. ${esc(i.fl)}</div>
 <div class="p">${brl(i.brl)}</div><div class="code">${i.c}</div></div></div>`}
function render(){
  const o=document.getElementById('ord').value;
  const key={p:i=>i.brl,'-p':i=>-i.brl,'-ct':i=>-i.ct}[o];
  const L=D.itens.map((i,k)=>[i,k]).sort((a,b)=>key(a[0])-key(b[0]));
  const main=L.filter(x=>!x[0].extra), ext=L.filter(x=>x[0].extra);
  let h='';
  if(ext.length) h+=`<h2>${ct(D.ctmin)} ct ou mais</h2>`;
  h+=`<div class="grid">${main.map(x=>card(...x)).join('')}</div>`;
  if(ext.length) h+=`<h2>${ct(D.extra)} – ${ct(D.ctmin-0.01)} ct · para comparar</h2><div class="grid">${ext.map(x=>card(...x)).join('')}</div>`;
  document.getElementById('main').innerHTML=h;
}
function abre(k){const i=D.itens[k];
  document.getElementById('v').src='v/Vision360.html?d='+i.c;
  const L=[['Forma',i.n],['Peso',ct(i.ct)+' ct'],['Cor',i.cor],['Pureza',i.pur],['Lapid. / Polim. / Simetria',i.cps],['Fluorescência',i.fl],['Medidas',i.med],['Certificado',i.lab]];
  document.getElementById('det').innerHTML=`<button class="x" onclick="fecha()">×</button><h3>${esc(i.n)} ${ct(i.ct)} ct</h3>
   <div class="p">${brl(i.brl)}</div><table>${L.map(([a,b])=>`<tr><th>${a}</th><td>${esc(b)}</td></tr>`).join('')}</table>
   <div class="note">Código da pedra: <b>${i.c}</b><br>Envie este código para reservar.</div>`;
  document.getElementById('m').classList.add('on')}
function fecha(){document.getElementById('m').classList.remove('on');document.getElementById('v').src='about:blank'}
document.getElementById('main').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)abre(+c.dataset.k)});
document.getElementById('m').addEventListener('click',e=>{if(e.target.id==='m')fecha()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fecha()});
document.getElementById('ord').addEventListener('input',render);
render();
</script>
</body>
</html>
